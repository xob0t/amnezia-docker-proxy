services:
  amnezia:
    build:
      context: .
      dockerfile: docker/amnezia/Dockerfile
    privileged: true
    environment:
      ACTIVE_CONFIG_FILE: ${ACTIVE_CONFIG_FILE:-amnezia.conf}
      VPN_IPV6: ${VPN_IPV6:-true}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    volumes:
      - ${CONFIG_DIR:-./config}:/config:ro
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${SOCKS_PORT:-1080}:1080"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3128}:3128"
    healthcheck:
      test: ["CMD-SHELL", "awg show \"$${ACTIVE_CONFIG_FILE%.conf}\" >/dev/null 2>&1 && ip -4 addr show dev \"$${ACTIVE_CONFIG_FILE%.conf}\" | grep -q 'inet '"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - amnezia-proxy

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    network_mode: service:amnezia
    depends_on:
      amnezia:
        condition: service_healthy
    environment:
      ACTIVE_CONFIG_FILE: ${ACTIVE_CONFIG_FILE:-amnezia.conf}
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      SOCKS5_USER: ${SOCKS5_USER:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}
      HTTP_USER: ${HTTP_USER:-}
      HTTP_PASSWORD: ${HTTP_PASSWORD:-}
      SOCKS5_PORT: 1080
      HTTP_PORT: 3128
    volumes:
      - ${CONFIG_DIR:-./config}:/config:ro
    restart: unless-stopped

networks:
  default:
    name: ${PROXY_NETWORK_NAME:-amnezia-proxy}
    external: ${PROXY_NETWORK_EXTERNAL:-false}
