services:
  amnezia:
    build:
      context: .
      dockerfile: docker/amnezia/Dockerfile
    container_name: amnezia-vpn
    privileged: true
    environment:
      ACTIVE_CONFIG_FILE: amnezia.conf
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    volumes:
      - ./config:/config
    ports:
      - "${SOCKS_PORT:-1080}:1080"
      - "${HTTP_PORT:-3128}:3128"
    healthcheck:
      test: ["CMD-SHELL", "test -s /config/amnezia.conf"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    container_name: amnezia-proxy
    network_mode: service:amnezia
    depends_on:
      amnezia:
        condition: service_healthy
    environment:
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      SOCKS5_USER: ${SOCKS5_USER:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}
      HTTP_USER: ${HTTP_USER:-}
      HTTP_PASSWORD: ${HTTP_PASSWORD:-}
      SOCKS5_PORT: ${SOCKS_PORT:-1080}
      HTTP_PORT: ${HTTP_PORT:-3128}
    restart: unless-stopped
